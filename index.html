<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Scientific Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            padding: 10px;
        }

        .calculator {
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            width: 360px;
        }

        .display {
            width: 100%;
            height: 75px;
            background: #0f172a;
            border: none;
            border-radius: 10px;
            color: #38bdf8;
            font-size: 1.8rem;
            text-align: right;
            padding: 0 15px;
            margin-bottom: 15px;
            box-sizing: border-box;
            pointer-events: none;
            word-wrap: break-word;
            word-break: break-all;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            background: #334155;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            height: 50px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: #475569;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-sci {
            background: #0369a1;
            color: #e2e8f0;
            font-size: 0.95rem;
        }

        .btn-sci:hover {
            background: #0284c7;
        }

        .btn-operator {
            background: #d97706;
            color: #fff;
        }

        .btn-operator:hover {
            background: #f59e0b;
        }

        .btn-clear {
            background: #dc2626;
            color: #fff;
        }

        .btn-clear:hover {
            background: #ef4444;
        }

        .btn-equal {
            background: #16a34a;
            color: #fff;
            grid-column: span 2;
        }

        .btn-equal:hover {
            background: #22c55e;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" class="display" id="display" value="0" disabled>
        <div class="buttons">
            <!-- Scientific & Advanced Functions -->
            <button class="btn-clear" onclick="clearDisplay()">C</button>
            <button class="btn-sci" onclick="appendValue('(')">(</button>
            <button class="btn-sci" onclick="appendValue(')')">)</button>
            <button class="btn-operator" onclick="appendValue('/')">&divide;</button>

            <button class="btn-sci" onclick="appendSci('Math.sin(', 'sin(')">sin</button>
            <button class="btn-sci" onclick="appendSci('Math.cos(', 'cos(')">cos</button>
            <button class="btn-sci" onclick="appendSci('Math.tan(', 'tan(')">tan</button>
            <button class="btn-operator" onclick="appendValue('*')">&times;</button>

            <button class="btn-sci" onclick="appendSci('Math.sqrt(', '√(')">&#8730;</button>
            <button class="btn-sci" onclick="appendSci('Math.log10(', 'log(')">log</button>
            <button class="btn-sci" onclick="appendSci('Math.log(', 'ln(')">ln</button>
            <button class="btn-operator" onclick="appendValue('-')">-</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="btn-operator" onclick="appendValue('+')">+</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="btn-sci" onclick="appendValue('**')">xʸ</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="btn-sci" onclick="appendValue('Math.PI', 'π')">π</button>

            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="btn-equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        let expression = ''; // Herrega sirrii JavaScriptaf tajaajilu
        let displayValue = ''; // Skiriinii irratti mul'atu

        function appendValue(val) {
            if (display.value === '0' && val !== '.') {
                expression = val;
                displayValue = val;
            } else {
                expression += val;
                displayValue += val;
            }
            display.value = displayValue;
        }

        function appendSci(func, label) {
            if (display.value === '0') {
                expression = func;
                displayValue = label;
            } else {
                expression += func;
                displayValue += label;
            }
            display.value = displayValue;
        }

        function clearDisplay() {
            expression = '';
            displayValue = '';
            display.value = '0';
        }

        function calculate() {
            try {
                // Herregicha herreguuf eval fayyadamne
                let result = eval(expression);
                // Gatii herregame xumuraa sirriitti qindeeffachuu (Decimal places)
                result = Math.round(result * 100000000) / 100000000;
                display.value = result;
                expression = result.toString();
                displayValue = result.toString();
            } catch (error) {
                display.value = 'Dogoggora (Error)';
                expression = '';
                displayValue = '';
            }
        }
    </script>

</body>
</html>
